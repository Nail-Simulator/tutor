<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Logic | Interaktivni Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">NAIL LOGIC</div>
        <nav>
            <span>Simulator Arhitekture Nokta v1.0</span>
        </nav>
    </header>

    <main>
        <section class="instructions">
            <h2>Simulator Turpijanja</h2>
            <p>1. Pomeraj miš da upravljaš turpijom.<br>
               2. Koristi <strong>Scroll (točkić)</strong> za rotaciju.<br>
               3. Drži <strong>Levi Klik</strong> i prevuci preko ivice nokta da "turpijaš".</p>
            <div id="feedback" class="idle">Sistemi spremni...</div>
        </section>

        <div id="app-container">
            <img id="nail-ref" src="https://images.unsplash.com/photo-1632345031435-8727f6897d53?q=80&w=800&auto=format&fit=crop" alt="Nokat">
            
            <canvas id="paint-layer"></canvas>
            
            <img id="nail-file" src="https://www.pngall.com/wp-content/uploads/13/Nail-File-PNG-Image.png" alt="Turpija">
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
