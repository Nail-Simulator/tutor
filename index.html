<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Logic PRO | Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">NAIL LOGIC <span class="pro">PRO</span></div>
        <div id="live-angle">UGAO: <span id="angle-value">0</span>°</div>
    </header>

    <section class="instructions-panel">
        <h3>Fokus: Pravilan Ugao Bočnih Strana</h3>
        <ul>
            <li>1. Pozicioniraj turpiju na ivicu nokta.</li>
            <li>2. Koristi <strong>Točkić Miša (Scroll)</strong> za rotaciju.</li>
            <li>3. Drži <strong>Levi Klik</strong> i prevuci da proveriš tehniku.</li>
        </ul>
    </section>

    <main>
        <div id="app-container">
            <img id="nail-ref" src="https://images.unsplash.com/photo-1632345031435-8727f6897d53?q=80&w=1200&auto=format&fit=crop" alt="Nokat">
            <img id="nail-file" src="https://www.pngall.com/wp-content/uploads/13/Nail-File-PNG-Image.png" alt="Turpija">
            
            <div id="feedback">Čekam tvoj potez...</div>
        </div>

        <div class="scroll-instruction">
            <span>SCROLL ZA ROTACIJU</span>
            <div class="arrows">
                <span class="arrow">↓</span>
                <span class="arrow">→</span>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
