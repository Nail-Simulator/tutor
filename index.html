<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Logic PRO | Simulator Arhitekture</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">NAIL LOGIC <span class="pro">PRO</span></div>
        <nav>
            <span>Trening Centar v2.0</span>
        </nav>
    </header>

    <main>
        <section class="instructions">
            <h2>Fokus: Pravilan Ugao Bočnih Strana</h2>
            <p>1. Pozicioniraj turpiju na ivicu nokta.<br>
               2. Koristi <strong>Točkić Miša (Scroll)</strong> za rotaciju.<br>
               3. Drži <strong>Levi Klik</strong> i prevuci da proveriš tehniku.</p>
            <div id="feedback" class="idle">Sistemi spremni. Čekam tvoj potez...</div>
        </section>

        <div id="app-container">
            <img id="nail-ref" src="https://images.unsplash.com/photo-1632345031435-8727f6897d53?q=80&w=1200&auto=format&fit=crop" alt="Nokat">
            
            <img id="nail-file" src="https://www.pngall.com/wp-content/uploads/13/Nail-File-PNG-Image.png" alt="Turpija">
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
